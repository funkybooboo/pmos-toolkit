[Service]
# gtaxlwifi: exynos-drm (card2, DSI panel) binds late on cold boot --
# after lightdm's first X start. X then fails with "open /dev/dri/card2:
# No such file or directory" / "no screens found" and the panel stays
# black until lightdm is restarted manually (verified by power-cycle test
# 2026-09-07). Wait for the panel connector before starting X (max 60s).
ExecStartPre=/bin/sh -c 'i=0; while ! grep -q connected /sys/class/drm/card*-DSI-*/status 2>/dev/null; do i=$((i+1)); [ "$i" -ge 60 ] && exit 1; sleep 1; done'